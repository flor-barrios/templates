<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Tracker</title><style>
:root{--bg:#f7f7f5;--card:#fff;--text:#20201f;--muted:#777773;--line:#e7e7e3;--soft:#efefec;--accent:#20201f}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:transparent;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.widget{position:relative;width:100%;min-height:100vh;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;overflow:hidden}
.k{margin:0;color:var(--muted);font-size:.65rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.big{margin:0;font-size:clamp(2rem,10vw,4rem);line-height:1;font-weight:650;letter-spacing:-.04em}
.sub{margin:0;color:var(--muted);font-size:.78rem;line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.center{text-align:center;align-items:center}.track{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .3s}
button,input,textarea{font:inherit}.btn{border:none;background:var(--accent);color:#fff;border-radius:99px;padding:9px 14px;cursor:pointer}.ghost{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:8px 12px;cursor:pointer}
.edit{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}.panel{display:none;position:absolute;inset:10px;z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;flex-direction:column;gap:9px;overflow:auto}.panel.open{display:flex}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 10px;color:var(--text)}.label{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mono{font-variant-numeric:tabular-nums}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--card:#222;--text:#f3f3f2;--muted:#9b9b97;--line:#343432;--soft:#2d2d2a;--accent:#f3f3f2}.btn{color:#191919}}
</style></head><body>
<main class="widget center"><p class="k">HYDRATION</p><p class="big mono"><span id="count">0</span><span style="font-size:.35em;color:var(--muted)"> / 8</span></p><div class="track" style="width:100%"><div class="fill" id="fill"></div></div><div class="row"><button class="btn" id="add">+ Glass</button><button class="ghost" id="minus">−</button><button class="ghost" id="reset">Reset</button></div></main>
<script>
const K="waterMinimal";let n=+localStorage.getItem(K)||0;function draw(){count.textContent=n;fill.style.width=Math.min(n/8*100,100)+"%";localStorage.setItem(K,n)}add.onclick=()=>{n++;draw()};minus.onclick=()=>{n=Math.max(0,n-1);draw()};reset.onclick=()=>{n=0;draw()};draw()
</script></body></html>

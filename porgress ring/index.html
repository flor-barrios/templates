<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth Progress Ring</title>

<!-- CUSTOMIZE: --ring-color for the ring color, DEFAULT_CURRENT/DEFAULT_TARGET below
     are only used the first time the widget loads (before the user edits anything). -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F7D9DF;
  --text:#5F4650;
  --muted:#8A6872;
  --ring-color:#E28A9A;
  --ring-track:#F2C6D0;
}
*{box-sizing:border-box;}
html,body{width:100%;height:100%;margin:0;}
body{min-height:100%;overflow:hidden;background:transparent;font-family:"Poppins",sans-serif;}
.widget{
  position:relative;width:100%;min-height:100vh;padding:clamp(18px,6vw,28px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:var(--bg);color:var(--text);border-radius:18px;
  box-shadow:0 8px 28px rgba(95,70,80,0.10);text-align:center;
}
.edit-toggle{
  position:absolute;top:12px;right:12px;background:#ffffffaa;border:none;
  width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.8rem;
  display:flex;align-items:center;justify-content:center;
}
.title{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0;}
.ring-wrap{position:relative;width:clamp(140px,42vw,190px);height:clamp(140px,42vw,190px);}
svg{transform:rotate(-90deg);width:100%;height:100%;}
circle{fill:none;stroke-linecap:round;}
.track{stroke:var(--ring-track);}
.progress{stroke:var(--ring-color);transition:stroke-dashoffset 1s ease;}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.pct{font-family:"DM Serif Display",serif;font-size:clamp(1.6rem,7vw,2.2rem);margin:0;}
.sub{font-size:.72rem;color:var(--muted);margin-top:2px;}

.edit-panel{
  display:none;flex-direction:column;gap:8px;background:#ffffffcc;border-radius:12px;
  padding:14px;width:100%;max-width:220px;
}
.edit-panel.open{display:flex;}
.field{display:flex;flex-direction:column;gap:3px;text-align:left;}
.field label{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.field input{
  border:1px solid #E7B9C4;border-radius:8px;padding:6px 8px;font-family:"Poppins",sans-serif;
  font-size:.85rem;color:var(--text);
}
.save-btn{
  border:none;background:var(--ring-color);color:#fff;padding:8px;border-radius:999px;
  font-family:"Poppins",sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;
}
.display-view{display:flex;flex-direction:column;align-items:center;gap:10px;}
</style>
</head>
<body>
<main class="widget">
  <button class="edit-toggle" id="editToggle" title="Edit values">✎</button>

  <div class="display-view" id="displayView">
    <p class="title">GROWTH GOAL</p>
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="85" stroke-width="14"/>
        <circle class="progress" id="progressCircle" cx="100" cy="100" r="85" stroke-width="14"/>
      </svg>
      <div class="center"><p class="pct" id="pct">0%</p></div>
    </div>
    <p class="sub" id="sub"></p>
  </div>

  <div class="edit-panel" id="editPanel">
    <div class="field">
      <label for="currentInput">Current followers</label>
      <input type="number" id="currentInput" min="0">
    </div>
    <div class="field">
      <label for="targetInput">Target followers</label>
      <input type="number" id="targetInput" min="1">
    </div>
    <button class="save-btn" id="saveBtn">Save</button>
  </div>
</main>

<script>
const KEY = "growthRingData";
const DEFAULT_CURRENT = 12400;
const DEFAULT_TARGET = 20000;

function loadData(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && typeof d.current === "number" && typeof d.target === "number") return d;
  }catch(e){}
  return { current: DEFAULT_CURRENT, target: DEFAULT_TARGET };
}
function saveData(d){ localStorage.setItem(KEY, JSON.stringify(d)); }

const circle = document.getElementById("progressCircle");
const r = 85;
const circumference = 2 * Math.PI * r;
circle.style.strokeDasharray = circumference;

function render(){
  const { current, target } = loadData();
  const percent = Math.min(current / target, 1);
  circle.style.strokeDashoffset = circumference;
  requestAnimationFrame(() => {
    circle.style.strokeDashoffset = circumference * (1 - percent);
  });
  document.getElementById("pct").textContent = Math.round(percent * 100) + "%";
  document.getElementById("sub").textContent =
    `${current.toLocaleString()} / ${target.toLocaleString()}`;
  document.getElementById("currentInput").value = current;
  document.getElementById("targetInput").value = target;
}

document.getElementById("editToggle").addEventListener("click", () => {
  const panel = document.getElementById("editPanel");
  const view = document.getElementById("displayView");
  const opening = !panel.classList.contains("open");
  panel.classList.toggle("open", opening);
  view.style.display = opening ? "none" : "flex";
});

document.getElementById("saveBtn").addEventListener("click", () => {
  const current = Number(document.getElementById("currentInput").value) || 0;
  const target = Math.max(Number(document.getElementById("targetInput").value) || 1, 1);
  saveData({ current, target });
  render();
  document.getElementById("editPanel").classList.remove("open");
  document.getElementById("displayView").style.display = "flex";
});

render();
</script>
</body>
</html>
